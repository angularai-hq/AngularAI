[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "angularai"
version = "0.1.0"
description = "A cortex in front of a language model. The workspace is bounded. The memory is not."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Teodor Walter Vido" }]
keywords = ["agents", "llm", "cli", "memory", "cortex"]
dependencies = [
    "textual>=2.1",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5",
    "reportlab>=4.2",
    "ruff>=0.8",
]

[project.scripts]
angularai = "angularai.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5",
    "reportlab>=4.2",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["angularai"]

[tool.hatch.build.targets.sdist]
exclude = ["packages"]

[tool.uv.workspace]
members = ["packages/angularai-mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["angularai", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["angularai", "tests"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["angularai", "tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["angularai"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
